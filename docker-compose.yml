# Infraestrutura de desenvolvimento local.
# Sobe apenas Postgres e Redis — a API, o worker e o painel rodam na sua
# máquina via `pnpm dev`, o que dá hot-reload e debug direto.
#
# Para o ambiente de produção (tudo em container + Caddy com HTTPS),
# ver docker-compose.prod.yml.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-orbita}
    ports:
      # Exposto só no loopback: nada de banco aberto pra internet.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbita} -d ${POSTGRES_DB:-orbita}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orbita-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
